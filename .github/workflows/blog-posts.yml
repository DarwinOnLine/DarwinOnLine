name: Latest blog posts

on:
  schedule:
    - cron: '0 */12 * * *' # Every 12 hours
  workflow_dispatch: # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-blog-posts:
    name: Update blog posts in README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Pull latest blog posts (FR)
        uses: gautamkrishnar/blog-post-workflow@1.9.4
        with:
          feed_list: "https://darwinonline.github.io/fr/feed.xml"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST-FR"

      - name: Pull latest blog posts (EN)
        uses: gautamkrishnar/blog-post-workflow@1.9.4
        with:
          feed_list: "https://darwinonline.github.io/en/feed.xml"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST-EN"
